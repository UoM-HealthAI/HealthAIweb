<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 16px sans-serif; fill: #2c3e50; }
      .axis-label { font: 12px sans-serif; fill: #34495e; }
      .tick-label { font: 10px sans-serif; fill: #7f8c8d; }
      .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
      .high-confidence { fill: #27ae60; }
      .medium-confidence { fill: #f39c12; }
      .low-confidence { fill: #e74c3c; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="title">Confidence Score Distribution</text>
  
  <!-- Chart Area -->
  <rect x="80" y="50" width="480" height="180" fill="none" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Y-axis -->
  <line x1="80" y1="50" x2="80" y2="230" stroke="#34495e" stroke-width="2"/>
  
  <!-- X-axis -->
  <line x1="80" y1="230" x2="560" y2="230" stroke="#34495e" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="75" y="55" text-anchor="end" class="tick-label">100</text>
  <text x="75" y="95" text-anchor="end" class="tick-label">75</text>
  <text x="75" y="135" text-anchor="end" class="tick-label">50</text>
  <text x="75" y="175" text-anchor="end" class="tick-label">25</text>
  <text x="75" y="215" text-anchor="end" class="tick-label">0</text>
  
  <!-- Y-axis title -->
  <text x="25" y="140" text-anchor="middle" class="axis-label" transform="rotate(-90, 25, 140)">Number of Predictions</text>
  
  <!-- X-axis labels -->
  <text x="120" y="245" text-anchor="middle" class="tick-label">0.0-0.2</text>
  <text x="200" y="245" text-anchor="middle" class="tick-label">0.2-0.4</text>
  <text x="280" y="245" text-anchor="middle" class="tick-label">0.4-0.6</text>
  <text x="360" y="245" text-anchor="middle" class="tick-label">0.6-0.8</text>
  <text x="440" y="245" text-anchor="middle" class="tick-label">0.8-1.0</text>
  
  <!-- X-axis title -->
  <text x="320" y="270" text-anchor="middle" class="axis-label">Confidence Score Range</text>
  
  <!-- Bars -->
  <rect x="100" y="210" width="40" height="20" class="bar low-confidence"/>
  <rect x="180" y="190" width="40" height="40" class="bar low-confidence"/>
  <rect x="260" y="170" width="40" height="60" class="bar medium-confidence"/>
  <rect x="340" y="120" width="40" height="110" class="bar medium-confidence"/>
  <rect x="420" y="80" width="40" height="150" class="bar high-confidence"/>
  
  <!-- Grid lines -->
  <line x1="80" y1="95" x2="560" y2="95" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="135" x2="560" y2="135" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="175" x2="560" y2="175" stroke="#ecf0f1" stroke-width="1"/>
  
  <!-- Legend -->
  <rect x="420" y="60" width="15" height="15" class="high-confidence"/>
   <text x="445" y="72" class="tick-label">High Confidence (กร0.8)</text>
  
  <rect x="420" y="80" width="15" height="15" class="medium-confidence"/>
  <text x="445" y="92" class="tick-label">Medium Confidence (0.4-0.8)</text>
  
  <rect x="420" y="100" width="15" height="15" class="low-confidence"/>
  <text x="445" y="112" class="tick-label">Low Confidence (<0.4)</text>
  
  <!-- Statistics -->
  <text x="100" y="280" class="tick-label">Total Predictions: 1000 | High Confidence: 642 (64.2%)</text>
</svg>

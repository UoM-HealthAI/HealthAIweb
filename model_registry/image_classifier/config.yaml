# Image Classification Model Configuration File
# This file describes what the Image Classification model does

# Basic Information
metadata:
  name: "Image Classification Model"
  description: "AI model for image classification and object recognition"
  version: "1.0.0"

# Input specifications
input:
  supported_formats:
    - ".jpg"   # JPEG format
    - ".jpeg"  # JPEG format
    - ".png"   # PNG format
  max_file_size: "50MB"

# Output specifications
output:
  visualization:
    - "prediction_chart.png"     # Classification results chart
    - "processed_image.png"      # Processed input image with predictions
  
  data_files:
    - "predictions.csv"          # Classification results in CSV format
    - "confidence_scores.json"   # Detailed confidence scores
  
  metadata:
    - "model_summary.json"       # Model prediction summary

# Processing parameters
parameters:
  default:
    confidence_threshold: 0.5    # Minimum confidence for predictions
    top_k: 5                     # Number of top predictions to return
    image_size: 224              # Input image size (224x224)
  
  user_configurable:
    - "confidence_threshold"
    - "top_k"

# Model interface
interface:
  entry_point: "model.py"
  main_function: "run_image_classifier"
  runtime: "python"
  dependencies:
    - "torch>=2.0.0"
    - "torchvision>=0.15.0"
    - "Pillow>=9.0.0"
    - "matplotlib>=3.6.0"

# Documentation for user-friendly display
documentation:
  simple_explanation: "Image Classification AI analyzes photos and identifies objects, animals, or scenes within them. It can recognize thousands of different categories like 'dog', 'car', 'flower', etc., and provides confidence scores for each prediction."
  when_to_use:
    - "When you need to automatically categorize or tag large collections of images"
    - "When you want to identify objects or scenes in photos"
    - "When you need to filter or sort images based on their content"
    - "When building applications that need to understand visual content"
  features:
    - "Multi-class Classification: Identifies multiple object categories in a single image"
    - "Confidence Scoring: Provides probability scores for each prediction"
    - "Pre-trained Models: Uses state-of-the-art neural networks trained on millions of images"
    - "Fast Processing: Optimized for quick inference on standard hardware"
  technical_details:
    - "Framework: PyTorch with torchvision"
    - "Architecture: ResNet-50 (Residual Neural Network)"
    - "Training Data: ImageNet dataset (1000+ categories)"
    - "Memory: 1-2GB RAM for typical usage"
    - "Processing Time: 1-5 seconds per image"
  citation: "He, K., Zhang, X., Ren, S., & Sun, J. (2016). Deep residual learning for image recognition. In Proceedings of the IEEE conference on computer vision and pattern recognition (pp. 770-778)."

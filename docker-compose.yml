version: '3.8'

services:
  # FastAPI Backend
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./model_registry:/app/model_registry
    environment:
      - PYTHONPATH=/app
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    networks:
      - healthai-network
    
  # React Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://0.0.0.0:8000
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - healthai-network

  # Demo Service with live reload
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    ports:
      - "7862:7862"
    volumes:
      - ./demo.py:/app/demo.py  # Mount demo.py for live updates
      - ./macaque.h5ad:/app/macaque.h5ad
    environment:
      - HOST=0.0.0.0
      - PORT=7862
    restart: unless-stopped
    networks:
      - healthai-network

# Custom network for lab access
networks:
  healthai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Week 1: Basic multi-service setup with Docker
# Usage: docker-compose up --build 
# Lab students can access via your computer's IP address 